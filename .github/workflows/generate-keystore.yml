name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing KEYSTORE_BASE64 secret if it already exists'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Check GH_PAT and existing KEYSTORE_BASE64 secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FORCE_OVERWRITE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT repository secret is not set. Add a PAT with repository Secrets (read/write) permission as GH_PAT."
            exit 1
          fi

          EXISTING_SECRETS="$(gh secret list --repo "${GITHUB_REPOSITORY}" | awk '{print $1}')"
          if printf '%s\n' "${EXISTING_SECRETS}" | grep -qx 'KEYSTORE_BASE64'; then
            if [ "${FORCE_OVERWRITE}" != "true" ]; then
              echo "::error::KEYSTORE_BASE64 already exists. Re-run with force=true to overwrite it."
              exit 1
            fi
            echo "KEYSTORE_BASE64 exists, but force=true was provided. Proceeding with regeneration."
          fi

      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate PKCS12 keystore and save repository secrets
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          KEY_ALIAS="modxlab"
          STORE_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::${STORE_PASS}"
          KEY_PASS="${STORE_PASS}"

          mkdir -p keystore-backup
          KEYSTORE_FILE="keystore-backup/release.keystore"

          keytool -genkeypair \
            -keystore "${KEYSTORE_FILE}" \
            -storetype PKCS12 \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "${STORE_PASS}" \
            -keypass "${KEY_PASS}" \
            -dname "CN=ModXLab, OU=Android, O=ModXLab, L=Unknown, ST=Unknown, C=US" \
            >/dev/null

          KS_B64="$(base64 -w 0 "${KEYSTORE_FILE}")"
          echo "::add-mask::${KS_B64}"

          CERT_SHA256="$(LC_ALL=C keytool -list -v \
            -keystore "${KEYSTORE_FILE}" \
            -storetype PKCS12 \
            -alias "${KEY_ALIAS}" \
            -storepass "${STORE_PASS}" \
            | grep -m1 'SHA256:' \
            | sed 's/.*SHA256:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d '[:space:]')"

          if [[ ! "${CERT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to extract valid 64-char SHA-256 certificate fingerprint."
            exit 1
          fi

          printf '%s' "${KS_B64}"      | gh secret set KEYSTORE_BASE64   --repo "${GITHUB_REPOSITORY}"
          printf '%s' "${STORE_PASS}"  | gh secret set KEYSTORE_PASSWORD --repo "${GITHUB_REPOSITORY}"
          printf '%s' "${KEY_ALIAS}"   | gh secret set KEY_ALIAS         --repo "${GITHUB_REPOSITORY}"
          printf '%s' "${KEY_PASS}"    | gh secret set KEY_PASSWORD      --repo "${GITHUB_REPOSITORY}"
          printf '%s' "${CERT_SHA256}" | gh secret set CERT_SHA256       --repo "${GITHUB_REPOSITORY}"

          cat > keystore-backup/credentials.txt <<EOF
          KEY_ALIAS=${KEY_ALIAS}
          KEYSTORE_PASSWORD=${STORE_PASS}
          KEY_PASSWORD=${KEY_PASS}
          CERT_SHA256=${CERT_SHA256}
          EOF
          chmod 600 keystore-backup/credentials.txt "${KEYSTORE_FILE}"

          echo "cert_sha256=${CERT_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "Successfully generated keystore and updated repository secrets."

      - name: Upload keystore and credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: keystore-backup/
          retention-days: 1
          if-no-files-found: error

      - name: Write job summary
        env:
          CERT_SHA256: ${{ steps.gen.outputs.cert_sha256 }}
        run: |
          {
            echo "## Release Keystore Generated"
            echo ""
            echo "**Signing Certificate SHA-256 Fingerprint:**"
            printf '`%s`\n' "${CERT_SHA256}"
            echo ""
            echo "> [!WARNING]"
            echo "> **Download the \`release-keystore-backup\` artifact immediately, store \`release.keystore\` and \`credentials.txt\` safely offline, and then delete the artifact from this workflow run.** Repository secrets cannot be read back after they are saved."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup local keystore files
        if: always()
        run: |
          rm -rf keystore-backup
